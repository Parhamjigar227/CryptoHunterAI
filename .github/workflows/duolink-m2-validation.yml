name: DuoLink Milestone 2 Android Build & Instrumentation Validation

on:
  push:
    branches:
      - "arena/c7250baa-cryptohunterai"
  workflow_dispatch:

permissions:
  contents: write   # required to attach the built APK to a GitHub Release
  checks: write

# Single source of truth for the release version in this workflow. Bump it here and everywhere -
# artifact names, the release tag, the download URL and the verification assertion - follows.
env:
  VERSION: "0.5.0"

jobs:
  gradle-build-and-unit-tests:
    name: Gradle 8.9 (JDK 17, SDK 35) + testDebugUnitTest + assembleDebug
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Bootstrap Android SDK 35 & Execute Build + Unit Tests
        id: build_step
        shell: bash
        run: |
          cat << 'EOS' > /tmp/run_build.sh
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          mkdir -p "$ANDROID_HOME"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p /tmp/cmdtools-unpack "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-unpack
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools-unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          { yes || true; } | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" >/tmp/sdk1.log 2>&1 || { cat /tmp/sdk1.log; exit 1; }

          echo "=== Environment & Preserved Archive Checksums ==="
          java -version
          sha256sum DuoLink/gradle/wrapper/gradle-wrapper.jar DuoLink_Android_Starter_v0.1.0.zip \
            DuoLink/app/src/main/res/drawable/nasrin_portrait.jpg \
            DuoLink/app/src/main/res/drawable/duolink_logo.jpg

          cd DuoLink
          echo "=== Gate 1: Official Gradle 8.9 Wrapper ==="
          ./gradlew --version

          echo "=== Gate 2: ./gradlew testDebugUnitTest ==="
          ./gradlew testDebugUnitTest --stacktrace

          echo "=== Gate 4: ./gradlew assembleDebug assembleDebugAndroidTest ==="
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK_PATH="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ls -lh "$APK_PATH" "$TEST_APK_PATH"
          echo "=== Debug APK & Test APK SHA-256 ==="
          sha256sum "$APK_PATH" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum "$TEST_APK_PATH"
          echo "=== Debug APK Badging Metadata (aapt2) ==="
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH" | head -n 25
          mkdir -p /tmp/apk-only
          # Version-less inside the artifact: `uses:` inputs are not shell-expanded, so the file that
          # the workflow downloads must have a fixed name. The release job renames it to the final
          # versioned filename right before upload.
          cp "$APK_PATH" /tmp/apk-only/DuoLink-Android-APK.apk
          ls -l /tmp/apk-only/DuoLink-Android-APK.apk
          EOS
          bash /tmp/run_build.sh 2>&1 | tee /tmp/job1.log
          exit "${PIPESTATUS[0]}"

      - name: Upload Clean Installable APK (Single File)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DuoLink-Android-APK
          path: /tmp/apk-only/DuoLink-Android-APK.apk

      - name: Upload Debug APK, SHA-256 & Unit Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolink-debug-apk-and-unit-reports
          path: |
            DuoLink/app/build/outputs/apk/debug/app-debug.apk
            DuoLink/app/build/outputs/apk/debug/app-debug.apk.sha256
            DuoLink/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            DuoLink/app/build/test-results/testDebugUnitTest/*.xml

      - name: Publish Verbatim Build & Unit Test Logs to Check Run
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_OUTCOME: ${{ steps.build_step.outcome }}
        run: |
          python3 - << 'PY'
          import json, os, pathlib, subprocess

          outcome = os.environ.get("STEP_OUTCOME", "failure")
          conclusion = "success" if outcome == "success" else "failure"
          log_path = pathlib.Path("/tmp/job1.log")
          raw = log_path.read_text(errors="replace") if log_path.exists() else "No log captured"

          sha_path = pathlib.Path("DuoLink/app/build/outputs/apk/debug/app-debug.apk.sha256")
          sha_line = sha_path.read_text().strip() if sha_path.exists() else "APK not produced"

          xml_texts = []
          for p in sorted(pathlib.Path("DuoLink/app/build/test-results/testDebugUnitTest").glob("TEST-*.xml")):
              xml_texts.append(p.read_text(errors="replace"))
          xml_block = "\n".join(xml_texts)

          summary = f"Outcome: `{conclusion}`\nDebug APK SHA-256: `{sha_line}`\n\n### Unit Test XML\n```xml\n{xml_block[:25000]}\n```"
          text = f"```text\n{raw[-55000:]}\n```"

          payload = {
              "name": "Report: Gradle 8.9 + testDebugUnitTest + Debug APK",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"Build & Unit Tests ({conclusion}) — {sha_line[:24]}",
                  "summary": summary[:60000],
                  "text": text[:60000],
              },
          }
          subprocess.run(
              ["gh", "api", "-X", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "-"],
              input=json.dumps(payload),
              text=True,
              check=True,
          )
          PY

  server-tests:
    name: Signaling server tests (Node 22, node:sqlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The peppered activation-code hash refuses to run without a pepper, by design. CI supplies a
      # throwaway one so the numeric-code tests exercise the real code path instead of skipping it.
      # This value is NOT a secret and must never be reused by a real deployment.
      - name: Run server test suite
        working-directory: DuoLink/server
        env:
          DUOLINK_ACTIVATION_PEPPER: "ci-only-throwaway-pepper-0123456789abcdef0123456789abcdef"
        run: |
          set -o pipefail
          node --version
          node --test "test/*.test.js" 2>&1 | tee /tmp/server-tests.log
          echo "--- summary ---"
          grep -E "^# (tests|pass|fail)" /tmp/server-tests.log

      - name: Upload server test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: duolink-server-test-log
          path: /tmp/server-tests.log
          retention-days: 30

  connected-android-test:
    name: connectedDebugAndroidTest (API ${{ matrix.api }})
    runs-on: ubuntu-24.04
    needs: gradle-build-and-unit-tests
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 29
            sysimg: "system-images;android-29;google_apis;x86_64"
            label: "API29-Android10"
          - api: 33
            sysimg: "system-images;android-33;google_apis;x86_64"
            label: "API33-Android13"
          - api: 34
            sysimg: "system-images;android-34;google_apis;x86_64"
            label: "API34-Android14"
    steps:
      - name: Free Runner Disk & Enable KVM
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          sudo chmod 666 /dev/kvm
          df -h /
          ls -la /dev/kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Boot Emulator & Run connectedDebugAndroidTest (API ${{ matrix.api }})
        id: instr_step
        env:
          TARGET_API: ${{ matrix.api }}
          TARGET_SYSIMG: ${{ matrix.sysimg }}
        shell: bash
        run: |
          cat << 'EOS' > /tmp/run_instr.sh
          set -euo pipefail
          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_HOME" "$ANDROID_AVD_HOME"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
            mkdir -p /tmp/cmdtools-unpack "$ANDROID_HOME/cmdline-tools"
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools-unpack
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            mv /tmp/cmdtools-unpack/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"

          echo "Installing SDK packages & system image ($TARGET_SYSIMG)..."
          { yes || true; } | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "emulator" "platforms;android-35" "build-tools;35.0.0" \
            "platforms;android-${TARGET_API}" "${TARGET_SYSIMG}" >/tmp/sdk_emu.log 2>&1 || { cat /tmp/sdk_emu.log; exit 1; }

          echo "Creating AVD duolink_avd_${TARGET_API}..."
          echo "no" | avdmanager create avd --force --name "duolink_avd_${TARGET_API}" \
            --package "${TARGET_SYSIMG}" --abi "x86_64" --device "pixel" >/tmp/avd.log 2>&1 || { cat /tmp/avd.log; exit 1; }

          adb start-server </dev/null >/dev/null 2>&1 || true

          "$ANDROID_HOME/emulator/emulator" -avd "duolink_avd_${TARGET_API}" \
            -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot \
            -partition-size 2048 -memory 2048 </dev/null >/tmp/emulator.log 2>&1 &
          EMU_PID=$!

          cleanup() {
            timeout 5 adb emu kill >/dev/null 2>&1 || true
            kill -9 "$EMU_PID" >/dev/null 2>&1 || true
            adb kill-server >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          BOOTED=0
          for i in $(seq 1 150); do
            if ! kill -0 "$EMU_PID" 2>/dev/null; then
              echo "ERROR: Emulator process exited prematurely! Emulator log:"
              cat /tmp/emulator.log || true
              exit 1
            fi
            STATE=$(timeout 5 adb get-state 2>/dev/null || true)
            if [ "$STATE" = "device" ]; then
              BC=$(timeout 5 adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)
              if [ "$BC" = "1" ] && timeout 5 adb shell pm path android >/dev/null 2>&1; then
                echo "Emulator API ${TARGET_API} booted cleanly in $((i*2)) seconds."
                BOOTED=1
                break
              fi
            fi
            sleep 2
          done

          if [ "$BOOTED" -ne 1 ]; then
            echo "ERROR: Emulator did not finish booting in 300s. Emulator log:"
            tail -n 120 /tmp/emulator.log || true
            exit 1
          fi

          sleep 4
          timeout 10 adb shell settings put global window_animation_scale 0 || true
          timeout 10 adb shell settings put global transition_animation_scale 0 || true
          timeout 10 adb shell settings put global animator_duration_scale 0 || true
          timeout 10 adb shell input keyevent 82 || true

          echo "=== Connected Android Runtime Properties ==="
          echo "ro.build.version.sdk=$(timeout 5 adb shell getprop ro.build.version.sdk | tr -d '\r')"
          echo "ro.build.version.release=$(timeout 5 adb shell getprop ro.build.version.release | tr -d '\r')"
          echo "ro.product.model=$(timeout 5 adb shell getprop ro.product.model | tr -d '\r')"

          cd DuoLink
          echo "=== Install Debug APK & Cold-Start MainActivity Smoke Check ==="
          ./gradlew installDebug --stacktrace
          timeout 30 adb shell am start -W -n com.duolink.app/.MainActivity
          sleep 3
          APP_PID=$(timeout 5 adb shell pidof com.duolink.app | tr -d '\r' || true)
          echo "Running com.duolink.app PID: ${APP_PID}"
          test -n "$APP_PID"

          echo "=== Executing ./gradlew connectedDebugAndroidTest ==="
          ./gradlew connectedDebugAndroidTest --stacktrace

          echo "=== Installing Debug & Test APKs for Raw AndroidJUnitRunner Stream ==="
          ./gradlew installDebug installDebugAndroidTest --stacktrace
          timeout 180 adb shell am instrument -w -r com.duolink.app.test/androidx.test.runner.AndroidJUnitRunner

          echo "=== Connected AndroidTest JUnit XML ==="
          find app/build/outputs/androidTest-results/connected -name "TEST-*.xml" -exec cat {} +
          EOS
          bash /tmp/run_instr.sh 2>&1 | tee /tmp/instr.log
          exit "${PIPESTATUS[0]}"

      - name: Upload Instrumentation Reports (${{ matrix.label }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results-${{ matrix.label }}
          path: DuoLink/app/build/outputs/androidTest-results/connected/**

      - name: Publish Verbatim Instrumentation Logs to Check Run (${{ matrix.label }})
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEP_OUTCOME: ${{ steps.instr_step.outcome }}
          MATRIX_LABEL: ${{ matrix.label }}
        run: |
          python3 - << 'PY'
          import json, os, pathlib, subprocess

          outcome = os.environ.get("STEP_OUTCOME", "failure")
          label = os.environ.get("MATRIX_LABEL", "API")
          conclusion = "success" if outcome == "success" else "failure"
          log_path = pathlib.Path("/tmp/instr.log")
          raw = log_path.read_text(errors="replace") if log_path.exists() else "No log captured"

          xml_texts = []
          for p in sorted(pathlib.Path("DuoLink/app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml")):
              xml_texts.append(f"<!-- {p} -->\n" + p.read_text(errors="replace"))
          xml_block = "\n".join(xml_texts)

          summary = f"Outcome: `{conclusion}` (`{label}`)\n\n### Connected AndroidTest XML\n```xml\n{xml_block[:28000]}\n```"
          text = f"```text\n{raw[-55000:]}\n```"

          payload = {
              "name": f"Report: connectedDebugAndroidTest ({label})",
              "head_sha": os.environ["GITHUB_SHA"],
              "status": "completed",
              "conclusion": conclusion,
              "output": {
                  "title": f"connectedDebugAndroidTest {label} ({conclusion})",
                  "summary": summary[:60000],
                  "text": text[:60000],
              },
          }
          subprocess.run(
              ["gh", "api", "-X", "POST", f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", "--input", "-"],
              input=json.dumps(payload),
              text=True,
              check=True,
          )
          PY

  publish-release:
    name: Publish GitHub Release with the real APK
    runs-on: ubuntu-24.04
    # Publishes only when the build AND the on-device suites on all three API levels passed. A release
    # that ships an APK the instrumentation matrix never vetted would be exactly the "green CI but
    # unverified" claim this project refuses to make.
    needs:
      - gradle-build-and-unit-tests
      - server-tests
      - connected-android-test
    if: github.ref == 'refs/heads/arena/c7250baa-cryptohunterai'
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download the APK built by the Gradle job
        uses: actions/download-artifact@v4
        with:
          name: DuoLink-Android-APK
          path: /tmp/release

      # The report artifacts live in the OTHER jobs' output, so they must be fetched explicitly.
      # Without this the release notes could only say "no report found", or worse, a hand-typed count.
      - name: Download test reports so the notes can state measured counts
        uses: actions/download-artifact@v4
        with:
          pattern: androidTest-results-*
          path: /tmp/instr-reports
          # merge-multiple puts every API level's XML into one tree; without it each artifact gets its
          # own subdirectory and the glob below would still work, but the flattened form is easier to
          # reason about and avoids three identically-named files colliding later.
          merge-multiple: true
        continue-on-error: true

      - name: Download unit test reports
        uses: actions/download-artifact@v4
        with:
          name: duolink-debug-apk-and-unit-reports
          path: /tmp/unit-reports
        continue-on-error: true

      - name: Name the APK for this version
        run: |
          set -euo pipefail
          # The artifact ships a fixed filename because `uses:` inputs are not shell-expanded, and the
          # name the user ends up downloading should carry the version. Rename here, where $VERSION
          # does expand, and keep the path the rest of the job uses in one place.
          test -f /tmp/release/DuoLink-Android-APK.apk || {
            echo "downloaded artifact does not contain DuoLink-Android-APK.apk"; ls -l /tmp/release; exit 1; }
          mv /tmp/release/DuoLink-Android-APK.apk "/tmp/release/DuoLink-v${VERSION}.apk"
          ls -l "/tmp/release/DuoLink-v${VERSION}.apk"

      - name: Verify the artifact is an APK, not a source archive
        run: |
          set -euo pipefail
          ls -l /tmp/release
          APK=/tmp/release/DuoLink-v${VERSION}.apk
          test -f "$APK" || { echo "APK missing from the artifact"; exit 1; }
          # An APK is a ZIP whose first entry is normally AndroidManifest.xml and which contains
          # classes.dex. Assert both, so a mis-uploaded source tarball can never be published as an app.
          python3 - "$APK" <<'PY'
          import sys, zipfile
          path = sys.argv[1]
          with zipfile.ZipFile(path) as z:
              names = z.namelist()
          assert "AndroidManifest.xml" in names, "artifact has no AndroidManifest.xml - not an APK"
          assert "classes.dex" in names, "artifact has no classes.dex - not an APK"
          print(f"OK: {path} is a real APK ({len(names)} entries, has manifest + classes.dex)")
          PY
          sha256sum "$APK" | tee /tmp/release/SHA256.txt
          stat -c '%s bytes' "$APK" | tee /tmp/release/SIZE.txt

      - name: Create or update the release and attach the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=/tmp/release/DuoLink-v${VERSION}.apk
          SHA=$(cut -d' ' -f1 /tmp/release/SHA256.txt)
          SIZE=$(cat /tmp/release/SIZE.txt)
          COMMIT=$(git rev-parse HEAD)
          TAG=v${VERSION}

          # Release notes are written with a quoted heredoc to a FILE rather than to a shell variable.
          # Command substitution strips trailing newlines and re-splits on IFS, and the notes contain
          # backticks, pipes and a markdown table - exactly the characters that turn "$(cat <<EOF ...)"
          # into a subtly mangled payload. `--notes-file` avoids the whole class of problem.
          cat > /tmp/notes.md <<'NOTES'
          ## DuoLink 0.4.0 — اتصال از راه دور با کد

          فایل ضمیمه‌شده یک APK نصب‌شدنی واقعی است (debug-signed)، که در همین workflow ساخته و روی سه نسخه اندروید تست شده است.

          | | |
          |---|---|
          | **نسخه** | `0.4.0` (versionCode 4) |
          | **کامیت** | `COMMIT_SHA_PLACEHOLDER` |
          | **حجم فایل** | `SIZE_PLACEHOLDER` |
          | **SHA-256** | `SHA_PLACEHOLDER` |

          ### نتیجه تست‌ها در این اجرا
          - تست‌های واحد Kotlin: `UNIT_COUNT_PLACEHOLDER`
          - تست‌های سرور Node: در جاب «Signaling server tests» اجرا و سبز شده است
          - تست‌های روی دستگاه (API 29 و 33 و 34): `INSTRUMENTED_COUNT_PLACEHOLDER`

          ### نصب
          راهنمای کامل فارسی: `DuoLink/docs/INSTALL.fa.md`
          راهنمای ساخت کد و اتصال گوشی دوم: `DuoLink/docs/REMOTE-CODE.fa.md`

          ### مهم
          «اتصال با QR» بدون هیچ سروری کار می‌کند.
          «اتصال از راه دور با کد» به یک سرور signaling نیاز دارد که هنوز به‌صورت عمومی میزبانی نشده است؛
          تا آن زمان این گزینه فقط با تنظیم دستی آدرس سرور کار می‌کند. این محدودیت در توضیح بالا پنهان نشده است.
          NOTES

          # Inject the build-specific values (no shell interpretation inside the notes).
          # Test counts are READ FROM THE REPORTS this run produced, not typed in by hand: a hard-coded
          # "N tests" is a claim that silently becomes false the first time somebody adds a test.
          python3 - "$SHA" "$SIZE" "$COMMIT" <<'PY'
          import glob, pathlib, sys, xml.etree.ElementTree as ET

          sha, size, commit = sys.argv[1], sys.argv[2], sys.argv[3]

          def count(xml_glob):
              total = failures = errors = 0
              for path in glob.glob(xml_glob, recursive=True):
                  try:
                      root = ET.parse(path).getroot()
                  except Exception:
                      continue
                  total += int(root.get('tests', 0))
                  failures += int(root.get('failures', 0))
                  errors += int(root.get('errors', 0))
              return total, failures, errors

          # Prefer the downloaded artifact; fall back to the in-workspace build output.
          unit_total, unit_fail, unit_err = count('/tmp/unit-reports/**/*.xml')
          if unit_total == 0:
              unit_total, unit_fail, unit_err = count('DuoLink/app/build/test-results/testDebugUnitTest/*.xml')
          instr_total, instr_fail, instr_err = count('/tmp/instr-reports/**/*.xml')
          if instr_total == 0:
              instr_total, instr_fail, instr_err = count('DuoLink/app/build/outputs/androidTest-results/connected/**/*.xml')

          p = pathlib.Path('/tmp/notes.md')
          text = p.read_text()
          text = text.replace('COMMIT_SHA_PLACEHOLDER', commit)
          text = text.replace('SIZE_PLACEHOLDER', size)
          text = text.replace('SHA_PLACEHOLDER', sha)
          text = text.replace(
              'UNIT_COUNT_PLACEHOLDER',
              f'{unit_total} تست، {unit_fail + unit_err} ناموفق' if unit_total else 'گزارش تست یافت نشد',
          )
          text = text.replace(
              'INSTRUMENTED_COUNT_PLACEHOLDER',
              f'{instr_total} تست، {instr_fail + instr_err} ناموفق' if instr_total else 'گزارش تست یافت نشد',
          )
          p.write_text(text)
          print(f'unit={unit_total} (fail={unit_fail + unit_err}) instrumented={instr_total} (fail={instr_fail + instr_err})')
          PY

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; uploading (clobber) the verified APK."
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --notes-file /tmp/notes.md
          else
            gh release create "$TAG" "$APK" \
              --title "DuoLink 0.4.0" \
              --notes-file /tmp/notes.md \
              --target "$COMMIT"
          fi

      - name: Confirm the published download URL works
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Check the ASSET METADATA rather than calling `gh api "$ASSET"` on the browser download URL.
          # The previous version resolved `.url`, which is the human download link, and then passed it to
          # `gh api` - which expects an API endpoint. That made a job whose releasing work had already
          # SUCCEEDED report failure purely because of how it verified itself.
          gh release view "v${VERSION}" --json assets \
            --jq '.assets[] | "attached: \(.name)  \(.size) bytes  state=\(.state)"'

          NAME=$(gh release view "v${VERSION}" --json assets --jq '.assets[0].name')
          SIZE=$(gh release view "v${VERSION}" --json assets --jq '.assets[0].size')
          STATE=$(gh release view "v${VERSION}" --json assets --jq '.assets[0].state')

          test "$NAME" = "DuoLink-v${VERSION}.apk" || { echo "unexpected asset name: $NAME"; exit 1; }
          test "$STATE" = "uploaded" || { echo "asset state is $STATE, expected uploaded"; exit 1; }
          # An APK this project builds is ~20 MB. A tiny asset would mean the upload truncated.
          test "$SIZE" -gt 10000000 || { echo "asset is implausibly small ($SIZE bytes)"; exit 1; }

          # Prove the browser download URL actually serves bytes, not just that an asset row exists.
          # GitHub redirects release downloads to a CDN, so follow redirects and inspect what comes back.
          URL="https://github.com/Parhamjigar227/CryptoHunterAI/releases/download/v${VERSION}/DuoLink-v${VERSION}.apk"
          CODE=$(curl -sS -L -o /tmp/downloaded.apk -w '%{http_code}' "$URL")
          echo "download HTTP status: $CODE"
          test "$CODE" = "200" || { echo "download URL did not return 200"; exit 1; }
          DL_SIZE=$(stat -c '%s' /tmp/downloaded.apk)
          echo "downloaded $DL_SIZE bytes"
          test "$DL_SIZE" = "$SIZE" || { echo "downloaded size $DL_SIZE != published $SIZE"; exit 1; }
          DL_SHA=$(sha256sum /tmp/downloaded.apk | cut -d' ' -f1)
          echo "downloaded sha256: $DL_SHA"
          grep -q "$DL_SHA" /tmp/release/SHA256.txt || { echo "downloaded APK does not match the built SHA-256"; exit 1; }
          echo "VERIFIED: the public download URL serves the exact APK that was built and tested."
          echo "Download URL: $URL"
