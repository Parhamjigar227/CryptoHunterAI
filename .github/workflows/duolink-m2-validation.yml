name: DuoLink Milestone 2 Android Build & Instrumentation Validation

on:
  push:
    branches:
      - "arena/c7250baa-cryptohunterai"
  workflow_dispatch:

jobs:
  gradle-build-and-unit-tests:
    name: Gradle 8.9 (JDK 17, SDK 35) + testDebugUnitTest + assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35 & Build-Tools 35.0.0
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          java -version
          sha256sum DuoLink/gradle/wrapper/gradle-wrapper.jar DuoLink_Android_Starter_v0.1.0.zip

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Gate 1 — Verify Official Gradle 8.9 Wrapper
        working-directory: DuoLink
        run: ./gradlew --version

      - name: Gate 2 — Execute testDebugUnitTest
        working-directory: DuoLink
        run: |
          ./gradlew testDebugUnitTest --info --stacktrace
          echo "=== JUnit XML Summary (testDebugUnitTest) ==="
          cat app/build/test-results/testDebugUnitTest/TEST-*.xml

      - name: Gate 4 — Build Real Debug APK & AndroidTest APK and Compute SHA-256
        working-directory: DuoLink
        run: |
          ./gradlew assembleDebug assembleDebugAndroidTest --stacktrace
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK_PATH="app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          ls -lh "$APK_PATH" "$TEST_APK_PATH"
          sha256sum "$APK_PATH" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          sha256sum "$TEST_APK_PATH"
          "$ANDROID_HOME/build-tools/35.0.0/aapt2" dump badging "$APK_PATH" | head -n 25

      - name: Upload Debug APK, SHA-256 & Unit Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: duolink-debug-apk-and-unit-reports
          path: |
            DuoLink/app/build/outputs/apk/debug/app-debug.apk
            DuoLink/app/build/outputs/apk/debug/app-debug.apk.sha256
            DuoLink/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            DuoLink/app/build/test-results/testDebugUnitTest/*.xml

  connected-android-test-api29:
    name: connectedDebugAndroidTest on Android 10 (API 29 — API 26–30 Gate)
    runs-on: ubuntu-latest
    needs: gradle-build-and-unit-tests
    timeout-minutes: 40
    steps:
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run connectedDebugAndroidTest on API 29 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Connected Emulator SDK: $(adb shell getprop ro.build.version.sdk) (Release $(adb shell getprop ro.build.version.release))"
            cd DuoLink
            ./gradlew connectedDebugAndroidTest --info --stacktrace
            echo "=== AndroidTest XML Report (API 29) ==="
            find app/build/outputs/androidTest-results/connected -name "TEST-*.xml" -exec cat {} +

      - name: Upload API 29 Instrumentation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results-api29
          path: DuoLink/app/build/outputs/androidTest-results/connected/**

  connected-android-test-api34:
    name: connectedDebugAndroidTest on Android 14 (API 34 — API 31+ Gate)
    runs-on: ubuntu-latest
    needs: gradle-build-and-unit-tests
    timeout-minutes: 40
    steps:
      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run connectedDebugAndroidTest on API 34 Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            echo "Connected Emulator SDK: $(adb shell getprop ro.build.version.sdk) (Release $(adb shell getprop ro.build.version.release))"
            cd DuoLink
            ./gradlew connectedDebugAndroidTest --info --stacktrace
            echo "=== AndroidTest XML Report (API 34) ==="
            find app/build/outputs/androidTest-results/connected -name "TEST-*.xml" -exec cat {} +

      - name: Upload API 34 Instrumentation Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results-api34
          path: DuoLink/app/build/outputs/androidTest-results/connected/**
